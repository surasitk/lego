{"name":"Mirror wish list images","on":{"workflow_dispatch":null},"permissions":{"contents":"write"},"jobs":{"mirror":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Mirror wish list images","run":"python3 - <<'PY'\nimport json, os, re, time, urllib.request\nIDS = ['cas295','cas441','cas527','pi004','col007','col166']\nUA = {'User-Agent': 'Mozilla/5.0 (compatible; lego-collection-mirror/1.0; +https://surasitk.github.io/lego/)'}\nos.makedirs('img/bl', exist_ok=True)\ngot, failed = [], []\nfor bid in IDS:\n    dst = 'img/bl/%s.jpg' % bid\n    if os.path.exists(dst):\n        got.append(bid); continue\n    src = 'https://www.brickeconomy.com/resources/images/minifigs/%s_large.jpg' % bid\n    try:\n        data = urllib.request.urlopen(urllib.request.Request(src, headers=UA), timeout=30).read()\n        if data[:2] != b'\\xff\\xd8':\n            raise ValueError('not a JPEG (got %r)' % data[:16])\n        open(dst, 'wb').write(data)\n        got.append(bid)\n    except Exception as e:\n        failed.append('%s: %s' % (bid, e))\n    time.sleep(3)\nprint('mirrored:', got)\nprint('failed:', failed)\np = 'animal-missing.html'\ns = open(p, encoding='utf-8').read()\nm = re.search(r'const FALLBACK=(\\[.*?\\]);', s, re.S)\narr = json.loads(m.group(1))\nn = 0\nfor r in arr:\n    bid = r.get('bricklink_id')\n    if bid in got and 'img.bricklink.com' in (r.get('image_url') or ''):\n        r['image_url'] = 'https://surasitk.github.io/lego/img/bl/%s.jpg' % bid\n        n += 1\nopen(p, 'w', encoding='utf-8').write(s[:m.start(1)] + json.dumps(arr, ensure_ascii=False) + s[m.end(1):])\nprint('FALLBACK entries repointed:', n)\nPY\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit diff --cached --quiet && echo \"no changes\" || git commit -m \"Mirror the 6 wish list images and repoint the FALLBACK array\"\ngit push"}]}}}
