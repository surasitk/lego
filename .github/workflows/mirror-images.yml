{"name":"Mirror figure images","on":{"workflow_dispatch":null},"permissions":{"contents":"write"},"jobs":{"mirror":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Download images and repoint figures.json","run":"python3 - <<'PY'\nimport json, os, time, urllib.request\nd = json.load(open('figures.json'))\nos.makedirs('img/bl', exist_ok=True)\nUA = {'User-Agent': 'Mozilla/5.0 (compatible; lego-collection-mirror/1.0; +https://surasitk.github.io/lego/)'}\ndone, missing = 0, []\nfor f in d:\n    u = f.get('image_url') or ''\n    if 'img.bricklink.com' not in u:\n        continue\n    bid = f.get('bricklink_id')\n    if not bid:\n        continue\n    dst = 'img/bl/%s.jpg' % bid\n    if not os.path.exists(dst):\n        kind = 'sets' if f.get('type') == 'set' else 'minifigs'\n        src = 'https://www.brickeconomy.com/resources/images/%s/%s_large.jpg' % (kind, bid)\n        try:\n            data = urllib.request.urlopen(urllib.request.Request(src, headers=UA), timeout=30).read()\n            if len(data) < 1000:\n                raise ValueError('suspiciously small: %d bytes' % len(data))\n            open(dst, 'wb').write(data)\n            time.sleep(0.4)\n        except Exception as e:\n            missing.append('%s (%s)' % (bid, e))\n            continue\n    f['image_url'] = 'https://surasitk.github.io/lego/img/bl/%s.jpg' % bid\n    done += 1\njson.dump(d, open('figures.json', 'w'), ensure_ascii=False, indent=1)\nprint('rewritten:', done)\nprint('could not fetch:', len(missing))\nfor m in missing:\n    print('  -', m)\nPY\npython3 gen_data.py || echo \"gen_data.py skipped\"\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\ngit diff --cached --quiet && echo \"no changes\" || git commit -m \"Mirror figure images into img/bl and repoint figures.json\"\ngit push"}]}}}
